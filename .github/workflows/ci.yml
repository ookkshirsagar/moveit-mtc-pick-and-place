name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and test (ROS 2 Jazzy)
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/moveit-mtc-pick-and-place

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-vcstool
          vcs import src < src/moveit-mtc-pick-and-place/dependencies.repos
          rosdep update --rosdistro jazzy
          rosdep install -y --rosdistro jazzy --from-paths src --ignore-src

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test (lint + end-to-end pick and place on mock hardware)
        run: |
          source install/setup.bash
          colcon test --packages-select rh56dfx_description ur5e_rh56dfx_description \
            ur5e_rh56dfx_moveit_config ur5e_rh56dfx_manipulation --event-handlers console_cohesion+
          colcon test-result --verbose

      - name: Test summary
        if: always()
        run: |
          {
            echo '### Test results'
            echo '```'
            colcon test-result --verbose 2>&1 | tail -40 || true
            echo '```'
            for f in build/*/Testing/Temporary/LastTestsFailed.log; do
              [ -s "$f" ] || continue
              pkg=$(echo "$f" | cut -d/ -f2)
              echo "#### Output of the failed tests in $pkg"
              echo '```'
              grep -v -E "Calling (PlanningRequest|PlanningResponse)Adapter|Calling Planner" \
                "build/$pkg/Testing/Temporary/LastTest.log" | tail -150
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
          # annotations are shown on the run page; the key lines of each failed test go there too
          for f in build/*/Testing/Temporary/LastTestsFailed.log; do
            [ -s "$f" ] || continue
            pkg=$(echo "$f" | cut -d/ -f2)
            msg=$( { echo "failed: $(cut -d: -f2 "$f" | tr '\n' ' ')"
                     grep -i -E "error|fail|died|exception|timeout|\[mtc_node\].*(Task|stage|plan)" \
                       "build/$pkg/Testing/Temporary/LastTest.log" | grep -v -E "Calling Planning|Calling Planner" \
                       | cut -c1-200 | tail -30; } | sed 's/%/%25/g' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=Failed tests in $pkg::$msg"
          done
