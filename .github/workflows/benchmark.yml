name: Benchmark

# Success rate and planning time over random cube and place poses, plus the stacking task, on mock hardware.
# The results table is on the run's summary page.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      runs:
        description: "pick and place runs (random seeds)"
        default: "20"

defaults:
  run:
    shell: bash

jobs:
  benchmark:
    name: Mock-hardware benchmark
    runs-on: ubuntu-24.04
    container: ros:jazzy-ros-base
    timeout-minutes: 90
    env:
      RUNS: ${{ github.event.inputs.runs || '20' }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: src/moveit-mtc-pick-and-place

      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3-vcstool
          vcs import src < src/moveit-mtc-pick-and-place/dependencies.repos
          rosdep update --rosdistro jazzy
          rosdep install -y --rosdistro jazzy --from-paths src --ignore-src

      - name: Build
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --event-handlers console_cohesion+ --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF

      - name: Pick and place, random cube and place poses
        run: |
          source install/setup.bash
          python3 src/moveit-mtc-pick-and-place/tools/benchmark_mock.py --runs "$RUNS" --min-success 90 \
            | tee pick_place.txt

      - name: Stack three cubes
        run: |
          source install/setup.bash
          python3 src/moveit-mtc-pick-and-place/tools/benchmark_mock.py --task stack --runs 3 --min-success 100 \
            | tee stack.txt

      - name: Summary
        if: always()
        run: |
          for f in pick_place stack; do
            [ -f "$f.txt" ] || continue
            echo "### $f" >> "$GITHUB_STEP_SUMMARY"
            sed -n '/^| Runs/,$p' "$f.txt" >> "$GITHUB_STEP_SUMMARY"
          done
