controller_manager:
  ros__parameters:
    update_rate: 100

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster


# ===============================
# ARM CONTROLLER
# ===============================
arm_controller:
  ros__parameters:
    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: false


# ===============================
# RIGHT HAND CONTROLLER
# ===============================
hand_controller:
  ros__parameters:
    joints:
      - right_wrist_yaw_joint
      - right_hand_base_joint
      - right_index_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_little_1_joint
      - right_thumb_1_joint
      - right_thumb_2_joint

    command_interfaces:
      - position

    state_interfaces:
      - position
      - velocity

    state_publish_rate: 50.0
    action_monitor_rate: 20.0

    allow_nonzero_velocity_at_trajectory_end: true
    allow_partial_joints_goal: true