# =========================================================
# MoveIt Controller Configuration
# =========================================================
#
# This file defines which controllers MoveIt should use
# when executing planned trajectories.
#
# Two controllers are used:
#   arm_controller  → UR5e arm motion
#   hand_controller → Inspire RH56DFX finger actuation
#
# The hand controller is configured for both left and right
# variants of the robot. Only the joints that exist in the
# loaded URDF will be used at runtime.

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager


trajectory_execution:

  # Allowed time scaling factor for trajectory execution
  allowed_execution_duration_scaling: 1.2

  # Additional time margin before aborting execution
  allowed_goal_duration_margin: 0.5

  # Allowed tolerance when the controller begins execution
  allowed_start_tolerance: 0.01

  allowed_start_tolerance: 0.05



moveit_simple_controller_manager:

  controller_names:
    - arm_controller
    - hand_controller



  # ======================================================
  # UR5e Arm Controller
  # ======================================================
  arm_controller:

    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: true

    joints:
      - shoulder_pan_joint
      - shoulder_lift_joint
      - elbow_joint
      - wrist_1_joint
      - wrist_2_joint
      - wrist_3_joint



  # ======================================================
  # Inspire RH56DFX Hand Controller
  # ======================================================
  #
  # Only the joints that exist in the loaded robot model
  # will be active during runtime.

  hand_controller:

    type: FollowJointTrajectory
    action_ns: follow_joint_trajectory
    default: false

    joints:

      # Left hand configuration
      - left_wrist_yaw_joint
      - left_hand_base_joint
      - left_index_1_joint
      - left_little_1_joint
      - left_middle_1_joint
      - left_ring_1_joint
      - left_thumb_1_joint
      - left_thumb_2_joint

      # Right hand configuration
      - right_wrist_yaw_joint
      - right_hand_base_joint
      - right_index_1_joint
      - right_little_1_joint
      - right_middle_1_joint
      - right_ring_1_joint
      - right_thumb_1_joint
      - right_thumb_2_joint